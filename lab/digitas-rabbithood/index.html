<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Detail — Boon's Portfolio">
  <title>Project — Boon</title>
  <base href="../../">
  <link rel="icon" type="image/png" href="assets/boon-logo.png">
  <link rel="apple-touch-icon" href="assets/boon-logo.png">
  <link rel="stylesheet" href="css/style.css?v=20260509-11">
</head>
<body>
  <div class="viewport-outer">
    <div class="site-frame" id="siteFrame">
      <header class="site-header" id="siteHeader">
        <div class="site-header-left"></div>
        <nav class="notch-nav" id="notchNav">
          <span class="site-logo" id="notchLogo"></span>
          <div class="notch-links-shell">
            <div class="notch-links" id="notchLinks"></div>
          </div>
        </nav>
        <div class="site-header-right"></div>
      </header>

      <section class="project-hero" id="projectHero"></section>
      <section class="project-info" id="projectInfo"></section>
      <section class="content-blocks" id="contentBlocks"></section>
    </div>
  </div>

  <footer class="site-footer" id="siteFooter"></footer>

  <button class="sync-toggle" id="syncToggle" title="Sync from data.js" onclick="syncFromFile()">↻</button>
  <button class="edit-toggle" id="editToggle">Edit</button>

  <div class="edit-toolbar" id="editToolbar">
    <button onclick="addContentBlock('full-image')">+ Full Image</button>
    <button onclick="addContentBlock('two-image')">+ Two Images</button>
    <button onclick="addContentBlock('3-grid')">+ 3-Grid</button>
    <button onclick="addContentBlock('4-grid')">+ 4-Grid</button>
    <button onclick="addContentBlock('text')">+ Text</button>
    <button onclick="addContentBlock('two-column')">+ Two Column</button>
    <button onclick="addContentBlock('video')">+ Video</button>
    <button onclick="exportData()">Export Data</button>
    <button class="primary" onclick="saveData(); showToast('Saved!');">Save</button>
  </div>

  <div id="toast" style="
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1A1A1A; color: #fff; font-family: var(--font-body); font-size: 13px;
    padding: 10px 24px; border-radius: 50px; opacity: 0; pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 3000;
  "></div>

  <script defer src="js/data.js?v=20260509-11"></script>
  <script defer src="js/core.js?v=20260509-11"></script>
  <script defer src="js/app.js?v=20260509-11"></script>
  <script defer src="js/editor.js?v=20260509-11"></script>
</body>
</html>
